# alembic.ini — Alembic configuration for AgentAssist
#
# The database URL is intentionally left blank here.
# It is injected at runtime by alembic/env.py via app.config.get_settings()
# so there is a single source of truth for the connection string.
#
# Usage:
#   alembic upgrade head          # apply all migrations
#   alembic downgrade -1          # roll back one revision
#   alembic revision --autogenerate -m "describe your change"
#   alembic upgrade head --sql    # generate SQL script (offline mode)
#   alembic history               # list all revisions

[alembic]
# Path to the alembic scripts directory (relative to this file).
script_location = alembic

# Template for new revision file names.
# %(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d%(second).2d is also useful.
file_template = %%(rev)s_%%(slug)s

# Paths to prepend to sys.path so that `app.*` imports work when running
# alembic commands from the project root.
prepend_sys_path = .

# Truncate long revision messages in the generated file name.
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless
# of autogenerate.
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a corresponding .py file
# to trigger the revision command.
sourceless = false

# Version locations — a single directory; can be extended to support multiple
# branches by listing additional paths separated by spaces or newlines.
version_locations = %(here)s/alembic/versions

# Version path separator — affects how version_locations is split.
# Use 'os' for OS default, 'space' for space, 'newline' for newline,
# 'colon' for colon, or 'semicolon' for semicolon.
version_path_separator = os

# sqlalchemy.url is intentionally left blank.
# It is set programmatically in alembic/env.py from app.config.get_settings().
sqlalchemy.url =

# ── Logging configuration ──────────────────────────────────────────────────────

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# Set to INFO to log SQL statements, DEBUG for full parameter dumps.
# WARN in production to avoid leaking sensitive data in logs.

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
